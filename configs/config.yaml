embedding:
  model_name: "BAAI/bge-small-en-v1.5"  # fast, good quality, ~130MB
  device: "cuda"
  batch_size: 32

retrieval:
  top_k: 5
  index_path: "data/index/faiss.index"

llm:
  provider: "ollama"
  model: "llama3.2:3b"  
  stream: true

cache:
  enabled: true
  similarity_threshold: 0.92  # tune later

chunking:
  chunk_size: 250
  chunk_overlap: 40